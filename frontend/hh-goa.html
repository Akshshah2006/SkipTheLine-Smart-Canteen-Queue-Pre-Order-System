<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HH Goa 2026 Builder Card Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0720;
      --panel: #171033;
      --text: #f8f6ff;
      --muted: #b3adcc;
      --accent: #9f74ff;
      --accent-2: #4ef2d0;
      --danger: #ff6b81;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at 10% 10%, #221657 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 14px 32px;
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }
    .panel {
      background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      padding: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    .sub { margin: 0 0 12px; color: var(--muted); font-size: .95rem; }
    label { display: block; margin: 10px 0 6px; font-weight: 600; font-size: .9rem; }
    input, select {
      width: 100%;
      background: #120e2a;
      color: var(--text);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
    }
    .hint { color: var(--muted); font-size: .8rem; margin-top: 6px; }
    .row { display: grid; gap: 10px; grid-template-columns: 1fr; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .primary { background: linear-gradient(120deg, var(--accent), #7442f4); color: white; }
    .secondary { background: #23184e; color: var(--text); border: 1px solid rgba(255,255,255,.2); }
    .share { background: linear-gradient(120deg, #1da1f2, #0d8de2); color: white; }
    .status { min-height: 1.4em; margin-top: 8px; color: var(--accent-2); font-size: .9rem; }
    .status.error { color: var(--danger); }

    .preview { display: grid; place-items: center; }
    canvas {
      width: min(100%, 420px);
      max-height: 80vh;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.2);
      background: #100b24;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    @media (min-width: 900px) {
      .wrap { grid-template-columns: minmax(320px, 380px) 1fr; align-items: start; }
      h1 { font-size: 1.6rem; }
      .row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1>HH Goa 2026 • Builder ID Card</h1>
      <p class="sub">Upload once, generate in seconds, download, and share to X with <strong>#FrameInGoa</strong>.</p>

      <label for="photoInput">Photo</label>
      <input id="photoInput" type="file" accept="image/*,.heic,.HEIC,.heif,.HEIF" />
      <p class="hint">Supports JPG, PNG, and HEIC/HEIF from iPhone.</p>

      <div class="row">
        <div>
          <label for="nameInput">Name</label>
          <input id="nameInput" type="text" maxlength="32" placeholder="Your name" />
        </div>
        <div>
          <label for="roleInput">Stack / Role</label>
          <input id="roleInput" type="text" maxlength="40" placeholder="Frontend • ML • Founder" />
        </div>
      </div>

      <label for="titleInput">Builder Title</label>
      <select id="titleInput"></select>

      <div class="actions">
        <button id="randomizeTitleBtn" class="secondary" type="button">New Random Title</button>
        <button id="downloadBtn" class="primary" type="button">Download PNG</button>
        <button id="shareBtn" class="share" type="button">Share to X</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section class="panel preview">
      <canvas id="cardCanvas" width="1080" height="1350" aria-label="Generated HH Goa card preview"></canvas>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>
  <script>
    const titles = [
      "Queue Breaker", "Latency Slayer", "Ship-It Ninja", "Pixel Conjurer", "Prompt Architect",
      "Stack Surfer", "Full-Stack Alchemist", "Bug Whisperer", "API Tamer", "Chaos-to-Prod Wizard"
    ];

    const photoInput = document.getElementById('photoInput');
    const nameInput = document.getElementById('nameInput');
    const roleInput = document.getElementById('roleInput');
    const titleInput = document.getElementById('titleInput');
    const randomizeTitleBtn = document.getElementById('randomizeTitleBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareBtn = document.getElementById('shareBtn');
    const canvas = document.getElementById('cardCanvas');
    const statusEl = document.getElementById('status');
    const ctx = canvas.getContext('2d');

    let uploadedImage = null;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', isError);
    }

    function hashText(text) {
      let h = 0;
      for (let i = 0; i < text.length; i++) h = ((h << 5) - h + text.charCodeAt(i)) | 0;
      return Math.abs(h);
    }

    function pickTitle() {
      const seed = `${nameInput.value.trim()}|${roleInput.value.trim()}|HHGOA`;
      const idx = hashText(seed || String(Date.now())) % titles.length;
      titleInput.value = titles[idx];
      renderCard();
    }

    function fillTitleOptions() {
      titles.forEach(title => {
        const opt = document.createElement('option');
        opt.value = title;
        opt.textContent = title;
        titleInput.appendChild(opt);
      });
      titleInput.value = titles[0];
    }

    function drawRoundedImage(img, x, y, w, h, r) {
      ctx.save();
      roundRectPath(x, y, w, h, r);
      ctx.clip();

      const scale = Math.max(w / img.width, h / img.height);
      const dw = img.width * scale;
      const dh = img.height * scale;
      const dx = x + (w - dw) / 2;
      const dy = y + (h - dh) / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.restore();
    }

    function roundRectPath(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function renderCard() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, '#170d3c');
      bg.addColorStop(0.5, '#2a1477');
      bg.addColorStop(1, '#09162f');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      const accent = ctx.createRadialGradient(150, 140, 20, 150, 140, 450);
      accent.addColorStop(0, 'rgba(159,116,255,0.45)');
      accent.addColorStop(1, 'rgba(159,116,255,0)');
      ctx.fillStyle = accent;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = 'rgba(255,255,255,0.86)';
      ctx.font = '700 40px Inter';
      ctx.fillText('HACKHAZARDS GOA 2026', 80, 90);

      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      ctx.font = '600 28px Inter';
      ctx.fillText('BUILDER ID', 80, 132);

      const photoX = 80;
      const photoY = 180;
      const photoW = 920;
      const photoH = 660;

      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(photoX, photoY, photoW, photoH);

      if (uploadedImage) {
        drawRoundedImage(uploadedImage, photoX, photoY, photoW, photoH, 40);
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 4;
        ctx.strokeRect(photoX + 2, photoY + 2, photoW - 4, photoH - 4);
        ctx.fillStyle = 'rgba(255,255,255,0.78)';
        ctx.font = '600 34px Inter';
        ctx.fillText('Upload your photo', photoX + 300, photoY + 360);
      }

      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.font = '800 68px Inter';
      const name = (nameInput.value || 'Your Name').trim().slice(0, 28);
      ctx.fillText(name, 80, 965);

      ctx.fillStyle = '#79ffd6';
      ctx.font = '700 36px Inter';
      const role = (roleInput.value || 'Builder').trim().slice(0, 36);
      ctx.fillText(role, 80, 1020);

      const title = titleInput.value || titles[0];
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      roundRectPath(80, 1060, 920, 110, 26);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 44px Inter';
      ctx.fillText(title, 120, 1130);

      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      ctx.font = '600 30px Inter';
      ctx.fillText('#FrameInGoa', 80, 1250);
    }

    async function fileToImage(file) {
      let sourceBlob = file;
      const lowerName = (file.name || '').toLowerCase();
      const isHeic = file.type.includes('heic') || lowerName.endsWith('.heic') || lowerName.endsWith('.heif');

      if (isHeic && typeof heic2any !== 'undefined') {
        sourceBlob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 });
      }

      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(sourceBlob);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Could not load image file.'));
        };
        img.src = url;
      });
    }

    function cardBlob() {
      return new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.96));
    }

    async function downloadCard() {
      const blob = await cardBlob();
      if (!blob) return setStatus('Could not export image.', true);
      const a = document.createElement('a');
      const safeName = (nameInput.value.trim() || 'builder').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
      a.href = URL.createObjectURL(blob);
      a.download = `hh-goa-2026-${safeName}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus('Downloaded successfully.');
    }

    async function shareToX() {
      const caption = `I just made my HH Goa 2026 Builder ID 🚀 #FrameInGoa`;
      const blob = await cardBlob();
      if (!blob) return setStatus('Could not prepare image for sharing.', true);

      const file = new File([blob], 'hh-goa-2026-card.png', { type: 'image/png' });
      const canNativeShare = navigator.share && navigator.canShare && navigator.canShare({ files: [file] });

      try {
        if (canNativeShare) {
          await navigator.share({
            files: [file],
            text: caption,
            title: 'HH Goa 2026 Builder ID'
          });
          setStatus('Shared using your device share sheet.');
          return;
        }

        const intent = `https://x.com/intent/tweet?text=${encodeURIComponent(caption)}`;
        window.open(intent, '_blank', 'noopener,noreferrer');
        setStatus('Opened X with prefilled caption. Attach the downloaded image if needed.');
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        setStatus('Sharing failed. Download image and post manually.', true);
      }
    }

    photoInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      setStatus('Processing photo...');
      try {
        uploadedImage = await fileToImage(file);
        renderCard();
        setStatus('Card generated.');
      } catch (err) {
        uploadedImage = null;
        renderCard();
        setStatus(err.message || 'Unsupported photo format.', true);
      }
    });

    [nameInput, roleInput, titleInput].forEach(el => el.addEventListener('input', renderCard));
    randomizeTitleBtn.addEventListener('click', pickTitle);
    downloadBtn.addEventListener('click', downloadCard);
    shareBtn.addEventListener('click', shareToX);

    fillTitleOptions();
    pickTitle();
  </script>
</body>
</html>
